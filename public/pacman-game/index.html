<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

	<style type="text/css">

		body {
			margin:0px auto;
			text-align:center;
			background-color:#000;
			color:gray;
			font-family:verdana, arial, helvetica;
			font-size:0.85em;
		}

		a {color:gray; font-family:verdana,arial,helvetica; font-size:0.8em; }

		a:hover {color:white;}

  <title></title>

<body>
	<img src="graphics/paclogo1.jpg" alt="Javascript Pacman logo">
	<br />
	<p style="font-family:system, terminal, courier, 'Courier New', monospaced; color:white; margin-top:0px; padding-top:0px; position:relative; top:-10px; margin:0px auto;" >Version 2.0</p>

	<!-- THE GAME IS LOADED INTO AN IFRAME //-->
	<iframe name="innerFrame" id="innerFrame" src="intropage.html" style="margin:0px auto; width:100%; height:80vh; overflow:hidden; border:0; outline:0;" frameBorder="0"></iframe>


<script>
	// we need to keep the focus on the iframe
	document.getElementById("innerFrame").contentWindow.focus();
	window.onclick = function() {
		document.getElementById("innerFrame").contentWindow.focus();
	}
</script>

</body>
